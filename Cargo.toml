[package]
name = "boost_coroutine"
description = "Boost C++ library boost_coroutine packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_coroutine"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_coroutine"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_assert = { version = "0.1.0", path = "../boost_assert" }
boost_config = { version = "0.1.0", path = "../boost_config" }
boost_context = { version = "0.1.0", path = "../boost_context" }
boost_core = { version = "0.1.0", path = "../boost_core" }
boost_exception = { version = "0.1.0", path = "../boost_exception" }
boost_move = { version = "0.1.0", path = "../boost_move" }
boost_system = { version = "0.1.0", path = "../boost_system" }
boost_throw_exception = { version = "0.1.0", path = "../boost_throw_exception" }
boost_type_traits = { version = "0.1.0", path = "../boost_type_traits" }
boost_utility = { version = "0.1.0", path = "../boost_utility" }

[build-dependencies]
zanbil-boost-build = "0.1.0"
